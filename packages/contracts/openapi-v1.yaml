openapi: 3.1.0
info:
  title: 方圆里 REST API
  version: 0.1.0
  description: |
    方圆里 MVP v1.0 的前后端 REST 契约。
    所有时间使用 RFC 3339 UTC，ID 使用 UUID 字符串，字段使用 lowerCamelCase。
servers:
  - url: https://api.fangyuanli.example/api/v1
    description: 正式环境占位地址
  - url: https://staging-api.fangyuanli.example/api/v1
    description: 测试环境占位地址
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Geo
  - name: Profiles
  - name: Friends
  - name: Conversations
  - name: Media
  - name: Places
  - name: Activities
  - name: Posts
  - name: Search
  - name: Sync

paths:
  /auth/sms/send:
    post:
      tags: [Auth]
      summary: 请求短信验证码
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
      responses:
        '200':
          description: 已接受短信发送请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /auth/sms/verify:
    post:
      tags: [Auth]
      summary: 验证短信并登录或注册
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsVerifyRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新登录令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, refreshToken]
              properties:
                deviceId:
                  type: string
                  format: uuid
                refreshToken:
                  type: string
      responses:
        '200':
          description: 刷新成功并轮换 Refresh Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前设备
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已退出
        default:
          $ref: '#/components/responses/ErrorResponse'

  /geo/context:
    post:
      tags: [Geo]
      summary: 创建或刷新短期位置上下文
      description: 精准位置只提交到本接口；后续地理业务使用返回的不透明令牌。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoContextRequest'
      responses:
        '200':
          description: 位置上下文和四广场
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoContextResponse'
        '422':
          description: 定位精度或坐标系统不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /me:
    get:
      tags: [Profiles]
      summary: 获取我的资料
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 我的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Profiles]
      summary: 修改我的资料
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 修改后的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileResponse'
        '409':
          $ref: '#/components/responses/VersionConflict'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /me/privacy:
    get:
      tags: [Profiles]
      summary: 获取隐私设置
      responses:
        '200':
          description: 隐私设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettingsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Profiles]
      summary: 更新隐私设置
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettingsUpdate'
      responses:
        '200':
          description: 生效后的隐私设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettingsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /me/notification-settings:
    patch:
      tags: [Profiles]
      summary: 更新全局通知设置
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [globalGroupMuted]
              properties:
                globalGroupMuted:
                  type: boolean
      responses:
        '200':
          description: 最终生效设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettingsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /users/{userId}:
    get:
      tags: [Profiles]
      summary: 获取当前查看者视角下的他人资料
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 按隐私与关系裁剪后的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /users/{userId}/posts:
    get:
      tags: [Profiles, Posts]
      summary: 获取该用户对当前账号可见的动态
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 动态列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /friend-requests:
    get:
      tags: [Friends]
      summary: 获取好友申请，待处理优先
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [received, sent, all]
            default: received
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected, all]
            default: all
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 好友申请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Friends]
      summary: 发送好友申请
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestCreate'
      responses:
        '201':
          description: 已创建好友申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestResponse'
        '409':
          description: 已是好友或已有待处理申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /friend-requests/{requestId}/decision:
    post:
      tags: [Friends]
      summary: 同意或拒绝好友申请
      description: 同意后原子建立好友关系和私聊会话，不自动发送问候。
      parameters:
        - $ref: '#/components/parameters/FriendRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accept, reject]
      responses:
        '200':
          description: 最终申请和关系状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendDecisionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /friends:
    get:
      tags: [Friends]
      summary: 获取联系人
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 联系人列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /friends/{friendUserId}/settings:
    patch:
      tags: [Friends]
      summary: 更新备注、动态权限和会话置顶
      parameters:
        - $ref: '#/components/parameters/FriendUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendSettingsUpdate'
      responses:
        '200':
          description: 最终生效设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendSettingsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /friends/{friendUserId}:
    delete:
      tags: [Friends]
      summary: 删除好友
      parameters:
        - $ref: '#/components/parameters/FriendUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已删除好友
        default:
          $ref: '#/components/responses/ErrorResponse'

  /blocks:
    get:
      tags: [Friends]
      summary: 获取黑名单
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 黑名单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /blocks/{targetUserId}:
    put:
      tags: [Friends]
      summary: 拉黑好友或陌生人
      parameters:
        - $ref: '#/components/parameters/TargetUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reasonCode:
                  type: string
                  maxLength: 32
      responses:
        '200':
          description: 拉黑后的关系状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Friends]
      summary: 解除拉黑并按拉黑前关系恢复
      parameters:
        - $ref: '#/components/parameters/TargetUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 解除后的关系状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /conversations:
    get:
      tags: [Conversations]
      summary: 获取好友消息页会话列表
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 私聊和系统会话；置顶优先
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      summary: 获取会话详情、身份、规则和能力
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/LocationContext'
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /conversations/{conversationId}/messages:
    get:
      tags: [Conversations]
      summary: 获取消息历史、增量或锚点上下文
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: beforeSequence
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: afterSequence
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: anchorSequence
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 按 sequence 排序的消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Conversations]
      summary: HTTP 兜底发送消息
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/LocationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSendRequest'
      responses:
        '201':
          description: 已持久化消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: 好友、拉黑、位置、禁言或群规则不允许
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /conversations/{conversationId}/read-cursor:
    put:
      tags: [Conversations]
      summary: 单调推进服务端已读游标
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastReadSequence]
              properties:
                lastReadSequence:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        '200':
          description: 最新已读和未读状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadCursorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /conversations/{conversationId}/settings:
    patch:
      tags: [Conversations]
      summary: 更新通知、置顶或公告关闭版本
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSettingsUpdate'
      responses:
        '200':
          description: 最终生效设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSettingsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /conversations/{conversationId}/search:
    get:
      tags: [Conversations, Search]
      summary: 查找指定会话聊天记录
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 带发送者头像、日期和定位序号的命中结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /media/uploads:
    post:
      tags: [Media]
      summary: 申请直接上传媒体
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadCreate'
      responses:
        '201':
          description: 短期上传凭证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '413':
          description: 文件或视频时长超过限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /media/uploads/{uploadId}/complete:
    post:
      tags: [Media]
      summary: 确认媒体已经上传
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etag, bytes, sha256]
              properties:
                etag:
                  type: string
                bytes:
                  type: integer
                  format: int64
                sha256:
                  type: string
      responses:
        '202':
          description: 已进入处理队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /media/{mediaId}:
    get:
      tags: [Media]
      summary: 获取媒体处理状态
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: 媒体状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /places/discover:
    post:
      tags: [Places]
      summary: 发现和搜索当前范围内地点
      parameters:
        - $ref: '#/components/parameters/LocationContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceDiscoverRequest'
      responses:
        '200':
          description: 地点卡片列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /places/{placeGroupId}:
    get:
      tags: [Places]
      summary: 获取地点详情和当前用户能力
      parameters:
        - $ref: '#/components/parameters/PlaceGroupId'
        - $ref: '#/components/parameters/LocationContext'
      responses:
        '200':
          description: 地点详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetailResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /places/{placeGroupId}/settings:
    patch:
      tags: [Places]
      summary: 群主或管理员更新地点群规则
      parameters:
        - $ref: '#/components/parameters/PlaceGroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceSettingsUpdate'
      responses:
        '200':
          description: 最终生效规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetailResponse'
        '409':
          $ref: '#/components/responses/VersionConflict'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /places/{placeGroupId}/claims:
    post:
      tags: [Places]
      summary: 提交商家认领申请
      parameters:
        - $ref: '#/components/parameters/PlaceGroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceClaimCreate'
      responses:
        '201':
          description: 已进入审核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericActionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /me/managed-places:
    get:
      tags: [Places]
      summary: 获取我作为群主或管理员管理的地点
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 不受当前距离限制的管理地点列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /places/{placeGroupId}/admins:
    post:
      tags: [Places]
      summary: 地点群主任命管理员
      parameters:
        - $ref: '#/components/parameters/PlaceGroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateUserId, expectedPlaceVersion]
              properties:
                candidateUserId:
                  type: string
                  format: uuid
                expectedPlaceVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 管理员和地点版本已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericActionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /places/{placeGroupId}/admins/{adminUserId}:
    delete:
      tags: [Places]
      summary: 地点群主移除管理员
      parameters:
        - $ref: '#/components/parameters/PlaceGroupId'
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已移除
        default:
          $ref: '#/components/responses/ErrorResponse'

  /places/{placeGroupId}/mutes/{mutedUserId}:
    put:
      tags: [Places]
      summary: 禁言地点群用户
      parameters:
        - $ref: '#/components/parameters/PlaceGroupId'
        - $ref: '#/components/parameters/MutedUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mutedUntil:
                  type: [string, 'null']
                  format: date-time
      responses:
        '200':
          description: 禁言已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericActionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Places]
      summary: 解除地点群用户禁言
      parameters:
        - $ref: '#/components/parameters/PlaceGroupId'
        - $ref: '#/components/parameters/MutedUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已解除
        default:
          $ref: '#/components/responses/ErrorResponse'

  /places/{placeGroupId}/feedback:
    post:
      tags: [Places]
      summary: 反馈地点资料或分类问题
      parameters:
        - $ref: '#/components/parameters/PlaceGroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '201':
          description: 已创建反馈单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericActionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /activities:
    post:
      tags: [Activities]
      summary: 创建活动
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
      responses:
        '201':
          description: 已创建活动和活动会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDetailResponse'
        '422':
          description: 时间、人数、加入或发言规则冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /activities/discover:
    post:
      tags: [Activities]
      summary: 发现、筛选和搜索活动
      parameters:
        - $ref: '#/components/parameters/LocationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityDiscoverRequest'
      responses:
        '200':
          description: 活动卡片列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /activities/{activityId}:
    get:
      tags: [Activities]
      summary: 获取活动详情
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/LocationContext'
      responses:
        '200':
          description: 活动详情和当前用户能力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDetailResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Activities]
      summary: 按群主或管理员权限修改活动
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityUpdateRequest'
      responses:
        '200':
          description: 修改后的活动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDetailResponse'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: 人数或规则不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /activities/{activityId}/join-requests:
    post:
      tags: [Activities]
      summary: 申请加入或直接加入活动
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 报名申请或成员结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityJoinResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags: [Activities]
      summary: 群主或管理员查看加入申请
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 加入申请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityJoinRequestListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /activities/{activityId}/join-requests/{joinRequestId}/decision:
    post:
      tags: [Activities]
      summary: 群主或管理员审批加入
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/JoinRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, expectedActivityVersion]
              properties:
                decision:
                  type: string
                  enum: [accept, reject]
                expectedActivityVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 审批后的申请和活动人数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityJoinResponse'
        '409':
          description: 活动已满或版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /activities/{activityId}/members:
    get:
      tags: [Activities]
      summary: 查看全部活动成员
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 群主、管理员和成员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityMemberListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /activities/{activityId}/members/{memberUserId}:
    patch:
      tags: [Activities]
      summary: 任命管理员、禁言、解除禁言或移除成员
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/MemberUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityMemberCommand'
      responses:
        '200':
          description: 命令已执行并返回最终状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericActionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /activities/{activityId}/announcement:
    put:
      tags: [Activities]
      summary: 发布或编辑活动置顶公告
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                expectedAnnouncementVersion:
                  type: [integer, 'null']
      responses:
        '200':
          description: 当前有效公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericActionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Activities]
      summary: 群主或管理员关闭当前公告
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 公告已关闭
        default:
          $ref: '#/components/responses/ErrorResponse'

  /me/activity-expectations:
    get:
      tags: [Activities]
      summary: 获取我的活动期待关键词
      responses:
        '200':
          description: 活动期待列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [Activities]
      summary: 替换我的活动期待关键词
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [keyword, radiusMeters]
                    properties:
                      keyword:
                        type: string
                        minLength: 1
                        maxLength: 64
                      radiusMeters:
                        type: integer
                        minimum: 100
                        maximum: 30000
      responses:
        '200':
          description: 最终生效列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /posts:
    post:
      tags: [Posts]
      summary: 发布动态
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/LocationContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '201':
          description: 已发布动态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /posts/discover:
    post:
      tags: [Posts]
      summary: 获取附近最新或热门动态
      parameters:
        - $ref: '#/components/parameters/LocationContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDiscoverRequest'
      responses:
        '200':
          description: 动态列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /feeds/friends:
    get:
      tags: [Posts]
      summary: 获取好友动态
      description: 新到旧，不展示距离和“好友可见”文案。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 好友动态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /posts/{postId}:
    get:
      tags: [Posts]
      summary: 获取统一动态详情
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 正文、媒体、互动和评论
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Posts]
      summary: 在服务端编辑期限内修改自己的动态
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
      responses:
        '200':
          description: 修改后的动态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResponse'
        '403':
          description: 编辑窗口已过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Posts]
      summary: 删除自己的动态
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已删除
        default:
          $ref: '#/components/responses/ErrorResponse'

  /posts/{postId}/like:
    put:
      tags: [Posts]
      summary: 点赞动态
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 最新点赞状态和数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Posts]
      summary: 取消点赞动态
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 最新点赞状态和数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /posts/{postId}/comments:
    post:
      tags: [Posts]
      summary: 评论动态或回复评论
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: 已创建评论
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /comments/{commentId}/like:
    put:
      tags: [Posts]
      summary: 点赞评论
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 最新点赞状态和数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Posts]
      summary: 取消点赞评论
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 最新点赞状态和数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /posts/{postId}/report:
    post:
      tags: [Posts]
      summary: 举报动态
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: 已创建举报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericActionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /search:
    post:
      tags: [Search]
      summary: 分类执行全局搜索
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: 每类最多返回指定数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /sync/events:
    get:
      tags: [Sync]
      summary: WebSocket 断线或多设备场景的增量同步
      parameters:
        - name: afterCursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 账号级增量事件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access-token

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      schema:
        type: string
    Platform:
      name: X-Platform
      in: header
      required: true
      schema:
        type: string
        enum: [ios, android]
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    LocationContext:
      name: X-Location-Context
      in: header
      required: false
      schema:
        type: string
        maxLength: 512
    LocationContextRequired:
      name: X-Location-Context
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FriendUserId:
      name: friendUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetUserId:
      name: targetUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FriendRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceGroupId:
      name: placeGroupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JoinRequestId:
      name: joinRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminUserId:
      name: adminUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MutedUserId:
      name: mutedUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberUserId:
      name: memberUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ErrorResponse:
      description: 业务或系统错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 对象不存在或当前用户无权得知其存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VersionConflict:
      description: 资源已被其他设备或管理员修改
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 操作过于频繁
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ResponseMeta:
      type: object
      required: [requestId, serverTime]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              examples: [ACTIVITY_CAPACITY_BELOW_MEMBER_COUNT]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string

    GenericActionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    GenericListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    SmsSendRequest:
      type: object
      required: [countryCode, phoneNumber, purpose]
      properties:
        countryCode:
          type: string
          examples: ['+86']
        phoneNumber:
          type: string
          minLength: 6
          maxLength: 24
        purpose:
          type: string
          enum: [login]

    SmsSendResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [verificationId, expiresAt, resendAfterSeconds]
          properties:
            verificationId:
              type: string
              format: uuid
            expiresAt:
              type: string
              format: date-time
            resendAfterSeconds:
              type: integer
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    SmsVerifyRequest:
      type: object
      required: [verificationId, code, device]
      properties:
        verificationId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 4
          maxLength: 8
        device:
          type: object
          required: [platform, deviceName]
          properties:
            platform:
              type: string
              enum: [ios, android]
            deviceName:
              type: string
              maxLength: 128
            pushToken:
              type: string

    AuthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required:
            [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, deviceId, userId]
          properties:
            accessToken:
              type: string
            accessTokenExpiresAt:
              type: string
              format: date-time
            refreshToken:
              type: string
            refreshTokenExpiresAt:
              type: string
              format: date-time
            deviceId:
