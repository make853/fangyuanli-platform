name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://fangyuanli:ci-password@127.0.0.1:5432/fangyuanli_test
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: fangyuanli_test
          POSTGRES_USER: fangyuanli
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fangyuanli -d fangyuanli_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @fangyuanli/api test:db
      - run: pnpm --filter @fangyuanli/api build
      - run: pnpm --filter @fangyuanli/api smoke:prod

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
